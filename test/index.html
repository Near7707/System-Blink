<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Blink test page</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; background: #1c1f24; color: #ddd; }
  #fake_top { display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  #fake_top button { height: 28px; }
  /* like SillyTavern: the chat column is the whole width on a phone, a centred column on a PC */
  #sheld { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; margin: 0 auto; }
  @media (min-width: 1000px) { #sheld { width: 50vw; } }
  #chat { flex: 1; overflow-y: auto; padding: 8px; }
  #chat .mes { padding: 6px 0; border-bottom: 1px solid #8884; }
  #chat .mes_text { font-size: 15px; }
  #form_sheld { padding: 6px; }
  #send_form { display: flex; gap: 6px; }
  #send_textarea { flex: 1; font-size: 16px; height: 38px; }
  #side { display: flex; gap: 8px; flex-wrap: wrap; }
  #extensionsMenu { border: 1px solid #888; width: 200px; margin: 6px; }
  #extensionsMenu .list-group-item { display: flex; gap: 6px; padding: 6px; align-items: center; cursor: pointer; }
  #extensions_settings2 { width: 360px; margin: 6px; }
  #extensions_settings2 .inline-drawer-content { display: block; }
  .text_pole { width: 100%; box-sizing: border-box; height: 30px; }
  textarea.text_pole { height: auto; }
  .menu_button { padding: 4px 10px; margin: 3px 0; }
  .checkbox_label { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
</style>
</head>
<body>
<div id="fake_top">
  <b>Fake SillyTavern</b>
  <button id="btn_turn">send</button>
  <button id="btn_swipe">swipe</button>
  <button id="btn_del">delete last</button>
  <button id="btn_branch">branch</button>
</div>
<details id="side_box"><summary>menu · settings</summary>
<div id="side">
  <div id="extensionsMenu"></div>
  <div id="extensions_settings2"></div>
</div>
</details>
<div id="sheld">
<div id="chat"></div>
<div id="form_sheld">
  <div id="send_form"><textarea id="send_textarea" placeholder="Type a message"></textarea></div>
</div>
</div>
<script src="/test/fake-st.js"></script>
<script type="module">
  window.__boot();
  await import('/index.js');
  await window.__fakeST.ctx.eventSource.emit('app_ready');
  window.__loaded = true;
</script>
</body>
</html>
